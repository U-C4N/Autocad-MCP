<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 180" width="760" height="180" role="img" aria-label="AutoCAD MCP Pro: one typed contract, two engines">
  <title>AutoCAD MCP Pro</title>
  <!-- Wordmark, dark-background variant: the mark at the left, the name and the one-line promise at the right. -->
  <defs>
    <marker id="arrow-wd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fbbf24"/>
    </marker>
  </defs>
  <g transform="translate(14 12) scale(0.61)">
    <path d="M 46 214 L 128 50 L 210 214" fill="none" stroke="#e5e7eb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 86 136 L 86 172 M 170 136 L 170 172" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
    <path d="M 90 154 L 166 154" stroke="#fbbf24" stroke-width="7" marker-start="url(#arrow-wd)" marker-end="url(#arrow-wd)"/>
    <circle cx="128" cy="50" r="19" fill="#0d1117" stroke="#38bdf8" stroke-width="7"/>
    <circle cx="128" cy="50" r="6" fill="#38bdf8"/>
  </g>
  <g font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" fill="#e5e7eb">
    <text x="190" y="88" font-size="58" font-weight="700" letter-spacing="-1">AutoCAD <tspan fill="#38bdf8">MCP</tspan> Pro</text>
    <text x="192" y="132" font-size="24" font-weight="400" fill="#9ca3af">one typed contract, two engines</text>
  </g>
  <path d="M 194 152 L 548 152" stroke="#fbbf24" stroke-width="3" marker-start="url(#arrow-wd)" marker-end="url(#arrow-wd)"/>
</svg>
