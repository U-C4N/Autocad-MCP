<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 180" width="760" height="180" role="img" aria-label="AutoCAD MCP Pro: one typed contract, two engines">
  <title>AutoCAD MCP Pro</title>
  <!-- Wordmark, light-background variant: the mark at the left, the name and the one-line promise at the right. -->
  <defs>
    <marker id="arrow-wl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/>
    </marker>
  </defs>
  <g transform="translate(14 12) scale(0.61)">
    <path d="M 46 214 L 128 50 L 210 214" fill="none" stroke="#1f2937" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 86 136 L 86 172 M 170 136 L 170 172" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
    <path d="M 90 154 L 166 154" stroke="#f59e0b" stroke-width="7" marker-start="url(#arrow-wl)" marker-end="url(#arrow-wl)"/>
    <circle cx="128" cy="50" r="19" fill="#ffffff" stroke="#0ea5e9" stroke-width="7"/>
    <circle cx="128" cy="50" r="6" fill="#0ea5e9"/>
  </g>
  <g font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" fill="#1f2937">
    <text x="190" y="88" font-size="58" font-weight="700" letter-spacing="-1">AutoCAD <tspan fill="#0ea5e9">MCP</tspan> Pro</text>
    <text x="192" y="132" font-size="24" font-weight="400" fill="#4b5563">one typed contract, two engines</text>
  </g>
  <!-- a hairline dimension under the promise: 257 tools wide, read at runtime -->
  <path d="M 194 152 L 548 152" stroke="#f59e0b" stroke-width="3" marker-start="url(#arrow-wl)" marker-end="url(#arrow-wl)"/>
</svg>
