<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220" role="img" aria-label="The verification workflow, in the order of the code block below it: drawing_preflight, drawing_plan with persist_requirements, mech_part_draw or the other generators, drawing_verify_requirements on the document, drawing_critique with drawing_refine back to the drawing, drawing_deliver measured again on the file, and later drawing_verify_requirements with manifest_path. Rules: nothing invented, measured on the geometry, refused by name.">
<title>AutoCAD MCP Pro: the verification workflow</title>
<defs><marker id="loop-light-fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/></marker><marker id="loop-light-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/></marker><marker id="loop-light-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0ea5e9"/></marker></defs>
<rect width="1000" height="220" fill="#ffffff"/>
<g font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif">
<rect x="14" y="20" width="120" height="88" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2.5"/>
<text x="74" y="44" font-size="13" font-weight="600" fill="#4b5563" text-anchor="middle">1 preflight</text>
<text x="74" y="66" font-size="13" font-weight="600" fill="#1f2937" text-anchor="middle">drawing_</text>
<text x="74" y="86" font-size="13" font-weight="600" fill="#1f2937" text-anchor="middle">preflight</text>
<path d="M 136 64 L 154 64" stroke="#4b5563" stroke-width="2.5" marker-end="url(#loop-light-fg)"/>
<rect x="156" y="20" width="120" height="88" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2.5"/>
<text x="216" y="44" font-size="13" font-weight="600" fill="#4b5563" text-anchor="middle">2 plan</text>
<text x="216" y="66" font-size="13" font-weight="600" fill="#1f2937" text-anchor="middle">drawing_plan</text>
<text x="216" y="86" font-size="13" font-weight="400" fill="#4b5563" text-anchor="middle">persist</text>
<path d="M 278 64 L 296 64" stroke="#4b5563" stroke-width="2.5" marker-end="url(#loop-light-fg)"/>
<rect x="298" y="20" width="120" height="88" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2.5"/>
<text x="358" y="44" font-size="13" font-weight="600" fill="#4b5563" text-anchor="middle">3 draw</text>
<text x="358" y="66" font-size="13" font-weight="600" fill="#1f2937" text-anchor="middle">mech_part_draw</text>
<text x="358" y="86" font-size="13" font-weight="400" fill="#4b5563" text-anchor="middle">or the generators</text>
<path d="M 420 64 L 438 64" stroke="#4b5563" stroke-width="2.5" marker-end="url(#loop-light-fg)"/>
<rect x="440" y="20" width="120" height="88" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2.5"/>
<text x="500" y="44" font-size="13" font-weight="600" fill="#f59e0b" text-anchor="middle">4 verify</text>
<text x="500" y="66" font-size="13" font-weight="600" fill="#1f2937" text-anchor="middle">drawing_verify_</text>
<text x="500" y="86" font-size="13" font-weight="400" fill="#4b5563" text-anchor="middle">on the document</text>
<path d="M 562 64 L 580 64" stroke="#4b5563" stroke-width="2.5" marker-end="url(#loop-light-fg)"/>
<rect x="582" y="20" width="120" height="88" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2.5"/>
<text x="642" y="44" font-size="13" font-weight="600" fill="#4b5563" text-anchor="middle">5 critique</text>
<text x="642" y="78" font-size="13" font-weight="600" fill="#1f2937" text-anchor="middle">drawing_critique</text>
<path d="M 704 64 L 722 64" stroke="#4b5563" stroke-width="2.5" marker-end="url(#loop-light-fg)"/>
<rect x="724" y="20" width="120" height="88" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2.5"/>
<text x="784" y="44" font-size="13" font-weight="600" fill="#4b5563" text-anchor="middle">6 deliver</text>
<text x="784" y="66" font-size="13" font-weight="600" fill="#1f2937" text-anchor="middle">drawing_deliver</text>
<text x="784" y="86" font-size="13" font-weight="400" fill="#4b5563" text-anchor="middle">on the file</text>
<path d="M 846 64 L 864 64" stroke="#4b5563" stroke-width="2.5" marker-end="url(#loop-light-fg)"/>
<rect x="866" y="20" width="120" height="88" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2.5"/>
<text x="926" y="44" font-size="13" font-weight="600" fill="#4b5563" text-anchor="middle">7 later</text>
<text x="926" y="66" font-size="13" font-weight="600" fill="#1f2937" text-anchor="middle">drawing_verify_</text>
<text x="926" y="86" font-size="13" font-weight="400" fill="#4b5563" text-anchor="middle">manifest_path=</text>
<path d="M 642 110 L 642 128 Q 642 134 636 134 L 364 134 Q 358 134 358 128 L 358 112" fill="none" stroke="#0ea5e9" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#loop-light-cyan)"/>
<text x="500" y="152" font-size="13" font-weight="600" fill="#0ea5e9" text-anchor="middle">drawing_refine</text>
<text x="15" y="190" font-size="13" font-weight="600" fill="#4b5563" text-anchor="start">rules</text>
<rect x="194" y="170" width="160" height="32" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
<circle cx="212" cy="186" r="4" fill="#f59e0b"/>
<text x="226" y="191" font-size="14" font-weight="600" fill="#1f2937" text-anchor="start">nothing invented</text>
<rect x="378" y="170" width="215" height="32" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
<circle cx="396" cy="186" r="4" fill="#f59e0b"/>
<text x="410" y="191" font-size="14" font-weight="600" fill="#1f2937" text-anchor="start">measured on the geometry</text>
<rect x="617" y="170" width="150" height="32" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
<circle cx="635" cy="186" r="4" fill="#f59e0b"/>
<text x="649" y="191" font-size="14" font-weight="600" fill="#1f2937" text-anchor="start">refused by name</text>
</g></svg>
