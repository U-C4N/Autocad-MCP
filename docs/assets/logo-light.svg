<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="AutoCAD MCP Pro mark: a drafted A with a dimension line for its crossbar and a connection node at its apex">
  <title>AutoCAD MCP Pro</title>
  <!-- The mark: a letter A drawn as two strokes, its crossbar an ISO dimension line (measured, never typed), its apex the node a client connects to. Light-background variant. -->
  <defs>
    <marker id="arrow-l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/>
    </marker>
  </defs>
  <!-- legs -->
  <path d="M 46 214 L 128 50 L 210 214" fill="none" stroke="#1f2937" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- extension ticks of the dimension -->
  <path d="M 86 136 L 86 172 M 170 136 L 170 172" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  <!-- the crossbar is a dimension line -->
  <path d="M 90 154 L 166 154" stroke="#f59e0b" stroke-width="7" stroke-linecap="butt" marker-start="url(#arrow-l)" marker-end="url(#arrow-l)"/>
  <!-- the apex node -->
  <circle cx="128" cy="50" r="19" fill="#ffffff" stroke="#0ea5e9" stroke-width="7"/>
  <circle cx="128" cy="50" r="6" fill="#0ea5e9"/>
</svg>
