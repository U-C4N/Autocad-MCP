<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="960" height="220" role="img" aria-label="The verification loop: drawing_plan, drawing_apply_iso_layers, entity_create or the engineering generators, drawing_critique with drawing_refine back to the drawing, drawing_verify_requirements, then drawing_finalize or drawing_deliver. Rules: nothing invented, measured on the geometry, refused by name.">
<title>AutoCAD MCP Pro: the verification loop</title>
<defs><marker id="loop-dark-fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/></marker><marker id="loop-dark-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fbbf24"/></marker><marker id="loop-dark-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/></marker></defs>
<rect width="960" height="220" fill="#0d1117"/>
<g font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif">
<rect x="15" y="20" width="140" height="88" rx="10" fill="#0d1117" stroke="#e5e7eb" stroke-width="2.5"/>
<text x="85" y="44" font-size="13" font-weight="600" fill="#9ca3af" text-anchor="middle">1 plan</text>
<text x="85" y="78" font-size="13" font-weight="600" fill="#e5e7eb" text-anchor="middle">drawing_plan</text>
<path d="M 157 64 L 171 64" stroke="#9ca3af" stroke-width="2.5" marker-end="url(#loop-dark-fg)"/>
<rect x="173" y="20" width="140" height="88" rx="10" fill="#0d1117" stroke="#e5e7eb" stroke-width="2.5"/>
<text x="243" y="44" font-size="13" font-weight="600" fill="#9ca3af" text-anchor="middle">2 layers</text>
<text x="243" y="66" font-size="13" font-weight="600" fill="#e5e7eb" text-anchor="middle">drawing_apply_</text>
<text x="243" y="86" font-size="13" font-weight="600" fill="#e5e7eb" text-anchor="middle">iso_layers</text>
<path d="M 315 64 L 329 64" stroke="#9ca3af" stroke-width="2.5" marker-end="url(#loop-dark-fg)"/>
<rect x="331" y="20" width="140" height="88" rx="10" fill="#0d1117" stroke="#e5e7eb" stroke-width="2.5"/>
<text x="401" y="44" font-size="13" font-weight="600" fill="#9ca3af" text-anchor="middle">3 draw</text>
<text x="401" y="66" font-size="13" font-weight="600" fill="#e5e7eb" text-anchor="middle">entity_create_*</text>
<text x="401" y="86" font-size="13" font-weight="400" fill="#9ca3af" text-anchor="middle">or the generators</text>
<path d="M 473 64 L 487 64" stroke="#9ca3af" stroke-width="2.5" marker-end="url(#loop-dark-fg)"/>
<rect x="489" y="20" width="140" height="88" rx="10" fill="#0d1117" stroke="#e5e7eb" stroke-width="2.5"/>
<text x="559" y="44" font-size="13" font-weight="600" fill="#9ca3af" text-anchor="middle">4 critique</text>
<text x="559" y="78" font-size="13" font-weight="600" fill="#e5e7eb" text-anchor="middle">drawing_critique</text>
<path d="M 631 64 L 645 64" stroke="#9ca3af" stroke-width="2.5" marker-end="url(#loop-dark-fg)"/>
<rect x="647" y="20" width="140" height="88" rx="10" fill="#0d1117" stroke="#fbbf24" stroke-width="2.5"/>
<text x="717" y="44" font-size="13" font-weight="600" fill="#fbbf24" text-anchor="middle">5 verify</text>
<text x="717" y="66" font-size="13" font-weight="600" fill="#e5e7eb" text-anchor="middle">drawing_verify_</text>
<text x="717" y="86" font-size="13" font-weight="600" fill="#e5e7eb" text-anchor="middle">requirements</text>
<path d="M 789 64 L 803 64" stroke="#9ca3af" stroke-width="2.5" marker-end="url(#loop-dark-fg)"/>
<rect x="805" y="20" width="140" height="88" rx="10" fill="#0d1117" stroke="#e5e7eb" stroke-width="2.5"/>
<text x="875" y="44" font-size="13" font-weight="600" fill="#9ca3af" text-anchor="middle">6 deliver</text>
<text x="875" y="66" font-size="13" font-weight="600" fill="#e5e7eb" text-anchor="middle">drawing_finalize</text>
<text x="875" y="86" font-size="13" font-weight="600" fill="#e5e7eb" text-anchor="middle">drawing_deliver</text>
<path d="M 559 110 L 559 128 Q 559 134 553 134 L 407 134 Q 401 134 401 128 L 401 112" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#loop-dark-cyan)"/>
<text x="480" y="152" font-size="13" font-weight="600" fill="#38bdf8" text-anchor="middle">drawing_refine</text>
<text x="15" y="190" font-size="13" font-weight="600" fill="#9ca3af" text-anchor="start">rules</text>
<rect x="194" y="170" width="160" height="32" rx="10" fill="#0d1117" stroke="#e5e7eb" stroke-width="2"/>
<circle cx="212" cy="186" r="4" fill="#fbbf24"/>
<text x="226" y="191" font-size="14" font-weight="600" fill="#e5e7eb" text-anchor="start">nothing invented</text>
<rect x="378" y="170" width="215" height="32" rx="10" fill="#0d1117" stroke="#e5e7eb" stroke-width="2"/>
<circle cx="396" cy="186" r="4" fill="#fbbf24"/>
<text x="410" y="191" font-size="14" font-weight="600" fill="#e5e7eb" text-anchor="start">measured on the geometry</text>
<rect x="617" y="170" width="150" height="32" rx="10" fill="#0d1117" stroke="#e5e7eb" stroke-width="2"/>
<circle cx="635" cy="186" r="4" fill="#fbbf24"/>
<text x="649" y="191" font-size="14" font-weight="600" fill="#e5e7eb" text-anchor="start">refused by name</text>
</g></svg>
