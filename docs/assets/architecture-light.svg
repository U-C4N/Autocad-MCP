<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 444" width="960" height="444" role="img" aria-label="How a call travels: an MCP client calls the FastMCP server; the call passes the middleware stack and the tool layer to the typed contract, which one engine implements, COM for live AutoCAD or ezdxf for headless DXF; the operation journal, checkpoints, lineage records and save markers live in the state folder.">
<title>AutoCAD MCP Pro: how a call travels</title>
<defs><marker id="arch-light-fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/></marker><marker id="arch-light-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/></marker><marker id="arch-light-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0ea5e9"/></marker></defs>
<rect width="960" height="444" fill="#ffffff"/>
<g font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif">
<rect x="16" y="104" width="148" height="160" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2.5"/>
<text x="90" y="132" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">MCP client</text>
<text x="90" y="158" font-size="13" font-weight="400" fill="#1f2937" text-anchor="middle">Claude Code</text>
<text x="90" y="180" font-size="13" font-weight="400" fill="#1f2937" text-anchor="middle">Claude Desktop</text>
<text x="90" y="202" font-size="13" font-weight="400" fill="#1f2937" text-anchor="middle">Cursor</text>
<text x="90" y="224" font-size="13" font-weight="400" fill="#4b5563" text-anchor="middle">any stdio or</text>
<text x="90" y="246" font-size="13" font-weight="400" fill="#4b5563" text-anchor="middle">HTTP host</text>
<path d="M 168 150 L 212 150" stroke="#4b5563" stroke-width="2.5" marker-start="url(#arch-light-fg)" marker-end="url(#arch-light-fg)"/>
<rect x="216" y="24" width="340" height="296" rx="12" fill="#ffffff" stroke="#1f2937" stroke-width="2.5"/>
<text x="232" y="48" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start">FastMCP server</text>
<text x="540" y="48" font-size="13" font-weight="400" fill="#4b5563" text-anchor="end">server.py</text>
<text x="232" y="70" font-size="13" font-weight="400" fill="#4b5563" text-anchor="start">middleware, first added = outermost</text>
<rect x="232" y="80" width="308" height="24" rx="8" fill="#ffffff" stroke="#4b5563" stroke-width="2"/>
<text x="246" y="97" font-size="13" font-weight="600" fill="#4b5563" text-anchor="start">1</text>
<text x="266" y="97" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">ErrorHandling</text>
<rect x="232" y="108" width="308" height="24" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
<text x="246" y="125" font-size="13" font-weight="600" fill="#4b5563" text-anchor="start">2</text>
<text x="266" y="125" font-size="13" font-weight="600" fill="#1f2937" text-anchor="start">Audit · operation journal</text>
<rect x="232" y="136" width="308" height="24" rx="8" fill="#ffffff" stroke="#4b5563" stroke-width="2"/>
<text x="246" y="153" font-size="13" font-weight="600" fill="#4b5563" text-anchor="start">3</text>
<text x="266" y="153" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">Timing</text>
<rect x="232" y="164" width="308" height="24" rx="8" fill="#ffffff" stroke="#4b5563" stroke-width="2"/>
<text x="246" y="181" font-size="13" font-weight="600" fill="#4b5563" text-anchor="start">4</text>
<text x="266" y="181" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">Logging</text>
<rect x="232" y="192" width="308" height="24" rx="8" fill="#ffffff" stroke="#4b5563" stroke-width="2"/>
<text x="246" y="209" font-size="13" font-weight="600" fill="#4b5563" text-anchor="start">5</text>
<text x="266" y="209" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">CapabilityRefusal · refusal as result</text>
<rect x="232" y="228" width="308" height="36" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
<text x="386" y="251" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">257 tools · 13 resources · 5 prompts</text>
<rect x="232" y="274" width="308" height="34" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
<text x="386" y="296" font-size="14" font-weight="600" fill="#1f2937" text-anchor="middle">typed contract · backends/contracts/</text>
<path d="M 542 291 L 592 291" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arch-light-amber)"/>
<rect x="596" y="24" width="348" height="296" rx="12" fill="#ffffff" stroke="#1f2937" stroke-width="2.5"/>
<text x="612" y="48" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start">Engine, one per server</text>
<text x="612" y="70" font-size="13" font-weight="400" fill="#4b5563" text-anchor="start">AUTOCAD_MCP_BACKEND = auto | com | ezdxf</text>
<text x="612" y="90" font-size="13" font-weight="400" fill="#4b5563" text-anchor="start">auto on Windows: COM first, else ezdxf</text>
<rect x="608" y="104" width="156" height="204" rx="10" fill="#ffffff" stroke="#0ea5e9" stroke-width="2.5"/>
<text x="686" y="132" font-size="15" font-weight="700" fill="#0ea5e9" text-anchor="middle">COM</text>
<text x="686" y="160" font-size="13" font-weight="400" fill="#1f2937" text-anchor="middle">live AutoCAD</text>
<text x="686" y="186" font-size="13" font-weight="400" fill="#1f2937" text-anchor="middle">Windows, pywin32</text>
<text x="686" y="212" font-size="13" font-weight="400" fill="#1f2937" text-anchor="middle">one STA thread</text>
<text x="686" y="238" font-size="13" font-weight="400" fill="#1f2937" text-anchor="middle">IMessageFilter</text>
<text x="686" y="264" font-size="13" font-weight="400" fill="#1f2937" text-anchor="middle">bound document</text>
<rect x="776" y="104" width="156" height="204" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2.5"/>
<text x="854" y="132" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">ezdxf</text>
<text x="854" y="160" font-size="13" font-weight="400" fill="#1f2937" text-anchor="middle">headless DXF</text>
<text x="854" y="186" font-size="13" font-weight="400" fill="#1f2937" text-anchor="middle">any OS</text>
<text x="854" y="212" font-size="13" font-weight="400" fill="#1f2937" text-anchor="middle">asyncio.to_thread</text>
<text x="854" y="238" font-size="13" font-weight="400" fill="#1f2937" text-anchor="middle">DXF undo snapshots</text>
<text x="854" y="264" font-size="13" font-weight="400" fill="#1f2937" text-anchor="middle">document registry</text>
<path d="M 386 322 L 386 344" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arch-light-amber)"/>
<path d="M 770 322 L 770 344" stroke="#4b5563" stroke-width="2.5" marker-end="url(#arch-light-fg)"/>
<rect x="216" y="348" width="728" height="88" rx="12" fill="#ffffff" stroke="#1f2937" stroke-width="2.5"/>
<text x="232" y="370" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">State folder</text>
<text x="332" y="370" font-size="13" font-weight="400" fill="#4b5563" text-anchor="start">ACADMCP_STATE_DIR, default %LOCALAPPDATA%\autocad-mcp-pro\state</text>
<rect x="228" y="380" width="167" height="46" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
<text x="312" y="399" font-size="13" font-weight="600" fill="#1f2937" text-anchor="middle">journal.sqlite3</text>
<text x="312" y="418" font-size="13" font-weight="400" fill="#4b5563" text-anchor="middle">operation journal</text>
<rect x="407" y="380" width="167" height="46" rx="8" fill="#ffffff" stroke="#4b5563" stroke-width="2"/>
<text x="491" y="399" font-size="13" font-weight="600" fill="#1f2937" text-anchor="middle">docs/&lt;lineage_id&gt;/</text>
<text x="491" y="418" font-size="13" font-weight="400" fill="#4b5563" text-anchor="middle">checkpoints</text>
<rect x="586" y="380" width="167" height="46" rx="8" fill="#ffffff" stroke="#4b5563" stroke-width="2"/>
<text x="670" y="399" font-size="13" font-weight="600" fill="#1f2937" text-anchor="middle">lineage/&lt;key&gt;.json</text>
