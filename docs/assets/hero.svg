<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="AutoCAD MCP Pro: one typed contract, two engines. A drafted A with a dimension line for its crossbar, a gear drawing with its section, centrelines and a dimension chain on a dark drafting sheet.">
<title>AutoCAD MCP Pro</title>
<defs>
