name: Release

# Tag-driven release: run the test gate, build, publish to PyPI, then cut the
# GitHub Release with the built artifacts attached.
#
# Auth: the PYPI_API_TOKEN repository secret (an API token from
# https://pypi.org/manage/account/token/). Once the project exists on PyPI,
# prefer replacing it with a project-scoped token — or switch back to trusted
# publishing (OIDC) by restoring `environment: pypi` + `id-token: write` and
# registering the publisher on PyPI.

on:
  push:
    tags: ["v*"]

env:
  # Keep in step with ci.yml; both read the same uv.lock.
  LOCKED_UV_VERSION: "0.12.1"
  # Keep in step with ci.yml: the CLI that validates the plugin.
  CLAUDE_CODE_VERSION: "2.1.310"

jobs:
  test:
    # The same three lanes as ci.yml, not one. This job was a single
    # ubuntu/3.11 run, so a Windows-only defect could reach PyPI without any
    # Windows job having executed -- which is not hypothetical: v1.5.0 shipped
    # with `except pywintypes.com_error` raising NameError wherever pywin32 is
    # absent, and only the Linux legs of ci.yml caught it.
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
            extra: pdf
          - os: ubuntu-latest
            python-version: "3.12"
            extra: pdf
          - os: windows-latest
            python-version: "3.11"
            extra: full
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install "uv==${{ env.LOCKED_UV_VERSION }}"
      - name: Install the locked environment
        # `--locked` refuses to re-resolve, so the artifact that goes to PyPI is
        # gated by the exact dependency set the suite was run against — not by
        # whatever the index happens to serve at tag time. ruff's version comes
        # from [dependency-groups] dev via the lock; it is not restated here.
        run: uv sync --locked --extra ${{ matrix.extra }} --python "${{ steps.python.outputs.python-path }}"
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync pytest -q

  headless-gates:
    # The release's headless lane. The correctness A/B suite runs against the
    # previous release tag as a gate: `--fail-on-regression` exits 1 when any
    # check that passed on that tag does not pass now (a fail, a miss, a crash
    # or a timeout). compare_versions.py checks the tag out into a throwaway
    # worktree, so the checkout needs the history and the tags. Then the
    # generated-file and document-number gates, as in ci.yml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.11"
      - run: pip install "uv==${{ env.LOCKED_UV_VERSION }}"
      - run: uv sync --locked --all-extras --python "${{ steps.python.outputs.python-path }}"
      - name: Correctness A/B against the previous release
        env:
          AUTOCAD_MCP_BACKEND: ezdxf
        run: |
          PREVIOUS=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^")
          echo "baseline: $PREVIOUS"
          uv run --no-sync python benchmarks/compare_versions.py "$PREVIOUS" --fail-on-regression
      - run: uv run --no-sync python scripts/build_plugin.py --check
      - run: uv run --no-sync python scripts/generate_tool_inventory.py --check
      - name: Document numbers
        env:
          AUTOCAD_MCP_BACKEND: ezdxf
        run: uv run --no-sync python scripts/check_doc_numbers.py

  plugin-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g "@anthropic-ai/claude-code@${{ env.CLAUDE_CODE_VERSION }}"
      - run: claude plugin validate --strict .
      - run: claude plugin validate --strict ./plugin

  build:
    needs: [test, headless-gates, plugin-validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify tag matches package version
        run: |
          pip install tomli-w 2>/dev/null || true
          PKG_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject version $PKG_VERSION" >&2
            exit 1
          fi
      - name: Build distributions
        run: |
          pip install build twine
          python -m build
          twine check dist/*
      - name: Check the distributions' contents
        run: python scripts/check_dist_contents.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  github-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
